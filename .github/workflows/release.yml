name: Build INAES Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-build:
    name: macOS build
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller kaleido pillow

      - name: Build macOS distribution
        run: bash scripts/build_macos_distribution.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: INAES-macOS-dmg
          path: |
            release_delivery/macOS_share/INAES-macOS.dmg
            release_delivery/macOS_share/INAES-macOS.dmg.sha256
          if-no-files-found: error

      - name: Upload macOS share package
        uses: actions/upload-artifact@v4
        with:
          name: INAES-macOS-share
          path: release_delivery/macOS_share.zip
          if-no-files-found: error

  windows-build:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller kaleido pillow

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Windows distribution
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows_distribution.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: INAES-Windows-installer
          path: release_delivery/windows_desktop_installer/INAES-Setup-Windows.exe
          if-no-files-found: warn

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: INAES-Windows-portable
          path: release_delivery/windows_desktop_installer/INAES-Portable-Windows.zip
          if-no-files-found: error

      - name: Upload Windows share package
        uses: actions/upload-artifact@v4
        with:
          name: INAES-Windows-share
          path: release_delivery/windows_desktop_installer.zip
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs:
      - macos-build
      - windows-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: INAES ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/INAES-macOS.dmg
            release-artifacts/INAES-macOS.dmg.sha256
            release-artifacts/macOS_share.zip
            release-artifacts/INAES-Setup-Windows.exe
            release-artifacts/INAES-Portable-Windows.zip
            release-artifacts/windows_desktop_installer.zip
